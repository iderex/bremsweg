[package]
name = "bremsweg-needs-hardware-network-or-time"
description = "Tests that need particular hardware, the network, or more time than a per change run allows. Not run on every change."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Empty on purpose. A test that needs the network needs it because of the
# service it talks to, not because of a crate, and the first dependency added
# here is one somebody argued for in an issue.
[dependencies]

# The fetch this harness makes a live request for. It is a development
# dependency because only a test uses it: nothing this crate ships calls it, and
# the crate itself stays empty of anything but the requirement machinery.
[dev-dependencies]
bremsweg-fit = { path = "../fit" }

[lints]
workspace = true
